<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Custo mensal projetado por volume">
<title>Custo mensal projetado por volume</title>
<style>
  .bg{fill:#fcfcfb} .borda{stroke:rgba(11,11,11,.10);fill:none}
  .t1{fill:#0b0b0b} .t2{fill:#52514e} .mut{fill:#898781}
  .grid{stroke:#e1e0d9;stroke-width:1} .base{stroke:#c3c2b7;stroke-width:1}
  .s1{fill:#2a78d6} .s2{fill:#eb6834} .gap{stroke:#fcfcfb;stroke-width:2}
  .s1s{stroke:#2a78d6} .s2s{stroke:#eb6834} .no{fill:#fcfcfb;stroke:#c3c2b7}
  text{font-family:system-ui, -apple-system, "Segoe UI", sans-serif}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .borda{stroke:rgba(255,255,255,.10)}
    .t1{fill:#f0efec} .t2{fill:#c3c2b7}
    .grid{stroke:#2c2c2a} .base{stroke:#383835}
    .s1{fill:#3987e5} .s2{fill:#d95926} .gap{stroke:#1a1a19}
    .s1s{stroke:#3987e5} .s2s{stroke:#d95926} .no{fill:#1a1a19;stroke:#383835}
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="340" rx="12"/>
<rect class="borda" x=".5" y=".5" width="759" height="339" rx="12"/>
<text x="24.0" y="34.0" class="t1" font-size="16" text-anchor="start" font-weight="600">Custo mensal projetado (US$)</text>
<text x="24.0" y="54.0" class="t2" font-size="12" text-anchor="start" font-weight="400">Jev pelo preço público; OCR em nuvem por preço de referência. OCR local custa só a máquina.</text>
<rect class="s1" x="24" y="74" width="12" height="12" rx="3"/>
<text x="42.0" y="84.0" class="t2" font-size="13" text-anchor="start" font-weight="400">Jev</text>
<rect class="s2" x="87.6" y="74" width="12" height="12" rx="3"/>
<text x="105.6" y="84.0" class="t2" font-size="13" text-anchor="start" font-weight="400">OCR em nuvem (se usado)</text>
<line class="grid" x1="90" y1="270.0" x2="730" y2="270.0"/>
<text x="84.0" y="274.0" class="mut" font-size="11" text-anchor="end" font-weight="400">0</text>
<line class="grid" x1="90" y1="247.1" x2="730" y2="247.1"/>
<text x="84.0" y="251.1" class="mut" font-size="11" text-anchor="end" font-weight="400">100</text>
<line class="grid" x1="90" y1="224.3" x2="730" y2="224.3"/>
<text x="84.0" y="228.3" class="mut" font-size="11" text-anchor="end" font-weight="400">200</text>
<line class="grid" x1="90" y1="201.4" x2="730" y2="201.4"/>
<text x="84.0" y="205.4" class="mut" font-size="11" text-anchor="end" font-weight="400">300</text>
<line class="grid" x1="90" y1="178.6" x2="730" y2="178.6"/>
<text x="84.0" y="182.6" class="mut" font-size="11" text-anchor="end" font-weight="400">400</text>
<line class="grid" x1="90" y1="155.7" x2="730" y2="155.7"/>
<text x="84.0" y="159.7" class="mut" font-size="11" text-anchor="end" font-weight="400">500</text>
<line class="grid" x1="90" y1="132.9" x2="730" y2="132.9"/>
<text x="84.0" y="136.9" class="mut" font-size="11" text-anchor="end" font-weight="400">600</text>
<line class="grid" x1="90" y1="110.0" x2="730" y2="110.0"/>
<text x="84.0" y="114.0" class="mut" font-size="11" text-anchor="end" font-weight="400">700</text>
<rect class="s1" x="150.0" y="265.0" width="110" height="5.0"/>
<path class="s2" d="M150.0,265.0 v-4.2 a4,4 0 0 1 4,-4 h102.0 a4,4 0 0 1 4,4 v4.2 z"/>
<line class="gap" x1="150" y1="265.0" x2="260" y2="265.0"/>
<text x="205.0" y="230.8" class="t1" font-size="12" text-anchor="middle" font-weight="600">Jev 22</text>
<text x="205.0" y="246.8" class="t2" font-size="12" text-anchor="middle" font-weight="400">+ OCR 36</text>
<text x="205.0" y="290.0" class="t1" font-size="13" text-anchor="middle" font-weight="500">100 mil/mês</text>
<rect class="s1" x="350.0" y="255.0" width="110" height="15.0"/>
<path class="s2" d="M350.0,255.0 v-20.5 a4,4 0 0 1 4,-4 h102.0 a4,4 0 0 1 4,4 v20.5 z"/>
<line class="gap" x1="350" y1="255.0" x2="460" y2="255.0"/>
<text x="405.0" y="204.4" class="t1" font-size="12" text-anchor="middle" font-weight="600">Jev 66</text>
<text x="405.0" y="220.4" class="t2" font-size="12" text-anchor="middle" font-weight="400">+ OCR 107</text>
<text x="405.0" y="290.0" class="t1" font-size="13" text-anchor="middle" font-weight="700">300 mil/mês</text>
<rect class="s1" x="550.0" y="219.8" width="110" height="50.2"/>
<path class="s2" d="M550.0,219.8 v-77.7 a4,4 0 0 1 4,-4 h102.0 a4,4 0 0 1 4,4 v77.7 z"/>
<line class="gap" x1="550" y1="219.8" x2="660" y2="219.8"/>
<text x="605.0" y="112.1" class="t1" font-size="12" text-anchor="middle" font-weight="600">Jev 219</text>
<text x="605.0" y="128.1" class="t2" font-size="12" text-anchor="middle" font-weight="400">+ OCR 357</text>
<text x="605.0" y="290.0" class="t1" font-size="13" text-anchor="middle" font-weight="500">1 milhão/mês</text>
<line class="base" x1="90" y1="270" x2="730" y2="270"/>
</svg>
