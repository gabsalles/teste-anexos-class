<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-label="Fluxo de processamento dos anexos">
<title>Fluxo de processamento dos anexos</title>
<style>
  .bg{fill:#fcfcfb} .borda{stroke:rgba(11,11,11,.10);fill:none}
  .t1{fill:#0b0b0b} .t2{fill:#52514e} .mut{fill:#898781}
  .grid{stroke:#e1e0d9;stroke-width:1} .base{stroke:#c3c2b7;stroke-width:1}
  .s1{fill:#2a78d6} .s2{fill:#eb6834} .gap{stroke:#fcfcfb;stroke-width:2}
  .s1s{stroke:#2a78d6} .s2s{stroke:#eb6834} .no{fill:#fcfcfb;stroke:#c3c2b7}
  text{font-family:system-ui, -apple-system, "Segoe UI", sans-serif}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .borda{stroke:rgba(255,255,255,.10)}
    .t1{fill:#f0efec} .t2{fill:#c3c2b7}
    .grid{stroke:#2c2c2a} .base{stroke:#383835}
    .s1{fill:#3987e5} .s2{fill:#d95926} .gap{stroke:#1a1a19}
    .s1s{stroke:#3987e5} .s2s{stroke:#d95926} .no{fill:#1a1a19;stroke:#383835}
  }

      .fio{fill:none;stroke-width:2;stroke-dasharray:4 5}
      .ponto-texto{fill:#2a78d6} .ponto-ocr{fill:#eb6834}
      @media (prefers-color-scheme: dark){.ponto-texto{fill:#3987e5} .ponto-ocr{fill:#d95926}}
      @media (prefers-reduced-motion: reduce){.mov{display:none}}
    </style>
<rect class="bg" x="0" y="0" width="860" height="300" rx="12"/>
<rect class="borda" x=".5" y=".5" width="859" height="299" rx="12"/>
<text x="24.0" y="34.0" class="t1" font-size="16" text-anchor="start" font-weight="600">Como cada anexo é processado</text>
<text x="24.0" y="54.0" class="t2" font-size="12" text-anchor="start" font-weight="400">Azul: PDF com camada de texto. Laranja: PDF escaneado, que passa pelo OCR antes.</text>
<path class="fio s1s" d="M120,150 C170,150 180,92 240,92 L420,92 C480,92 490,150 540,150 L660,150"/>
<path class="fio s2s" d="M120,150 C170,150 180,208 240,208 L420,208 C480,208 490,150 540,150 L660,150"/>
<circle class="mov ponto-texto" r="6"><animateMotion dur="2.4s" begin="-0.0s" repeatCount="indefinite" path="M120,150 C170,150 180,92 240,92 L420,92 C480,92 490,150 540,150 L660,150" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/></circle>
<circle class="mov ponto-texto" r="6"><animateMotion dur="2.4s" begin="-0.8s" repeatCount="indefinite" path="M120,150 C170,150 180,92 240,92 L420,92 C480,92 490,150 540,150 L660,150" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/></circle>
<circle class="mov ponto-texto" r="6"><animateMotion dur="2.4s" begin="-1.6s" repeatCount="indefinite" path="M120,150 C170,150 180,92 240,92 L420,92 C480,92 490,150 540,150 L660,150" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/></circle>
<circle class="mov ponto-texto" r="6"><animateMotion dur="2.4s" begin="-2.4s" repeatCount="indefinite" path="M120,150 C170,150 180,92 240,92 L420,92 C480,92 490,150 540,150 L660,150" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/></circle>
<circle class="mov ponto-texto" r="6"><animateMotion dur="2.4s" begin="-3.2s" repeatCount="indefinite" path="M120,150 C170,150 180,92 240,92 L420,92 C480,92 490,150 540,150 L660,150" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/></circle>
<circle class="mov ponto-texto" r="6"><animateMotion dur="2.4s" begin="-4.0s" repeatCount="indefinite" path="M120,150 C170,150 180,92 240,92 L420,92 C480,92 490,150 540,150 L660,150" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/></circle>
<circle class="mov ponto-ocr" r="6"><animateMotion dur="4.8s" begin="-0.4s" repeatCount="indefinite" path="M120,150 C170,150 180,208 240,208 L420,208 C480,208 490,150 540,150 L660,150" keyPoints="0;0.3;0.55;1" keyTimes="0;0.15;0.75;1" calcMode="linear"/></circle>
<circle class="mov ponto-ocr" r="6"><animateMotion dur="4.8s" begin="-2.8s" repeatCount="indefinite" path="M120,150 C170,150 180,208 240,208 L420,208 C480,208 490,150 540,150 L660,150" keyPoints="0;0.3;0.55;1" keyTimes="0;0.15;0.75;1" calcMode="linear"/></circle>
<rect class="no" x="24" y="120" width="96" height="60" rx="10"/>
<text x="72.0" y="146.0" class="t1" font-size="14" text-anchor="middle" font-weight="600">PDF</text>
<text x="72.0" y="164.0" class="mut" font-size="11" text-anchor="middle" font-weight="400">256 anexos</text>
<rect class="no" x="240" y="66" width="180" height="52" rx="10"/>
<text x="330.0" y="89.0" class="t1" font-size="13" text-anchor="middle" font-weight="600">PyMuPDF</text>
<text x="330.0" y="106.0" class="t2" font-size="11" text-anchor="middle" font-weight="400">lê o texto · 0,006 s</text>
<rect class="no" x="240" y="182" width="180" height="52" rx="10"/>
<text x="330.0" y="205.0" class="t1" font-size="13" text-anchor="middle" font-weight="600">OCR Apple Vision</text>
<text x="330.0" y="222.0" class="t2" font-size="11" text-anchor="middle" font-weight="400">imagem → texto · 0,94 s</text>
<rect class="no" x="540" y="116" width="120" height="68" rx="10"/>
<text x="600.0" y="143.0" class="t1" font-size="15" text-anchor="middle" font-weight="700">Jev</text>
<text x="600.0" y="161.0" class="t2" font-size="11" text-anchor="middle" font-weight="400">0,28 s · ~5,2 mil tokens</text>
<path class="fio base" d="M660,150 L700,150"/>
<rect class="no" x="700" y="104" width="136" height="92" rx="10"/>
<text x="768.0" y="130.0" class="t1" font-size="13" text-anchor="middle" font-weight="600">classe</text>
<text x="768.0" y="148.0" class="t2" font-size="11" text-anchor="middle" font-weight="400">+ probabilidades</text>
<text x="768.0" y="164.0" class="t2" font-size="11" text-anchor="middle" font-weight="400">+ tempo, tokens</text>
<text x="768.0" y="180.0" class="t2" font-size="11" text-anchor="middle" font-weight="400">+ custo</text>
<text x="24.0" y="276.0" class="mut" font-size="11" text-anchor="start" font-weight="400">Cada execução grava uma linha por anexo em execucoes/&lt;run_id&gt;/resultados.jsonl</text>
</svg>
